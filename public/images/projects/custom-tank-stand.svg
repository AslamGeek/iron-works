<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14161b"/>
      <stop offset="100%" stop-color="#1d2027"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgGrad9)"/>

  <!-- Cylindrical Water Tanks on top -->
  <g opacity="0.85">
    <ellipse cx="320" cy="110" rx="90" ry="25" fill="#1e3a5f" stroke="#38bdf8" stroke-width="2"/>
    <path d="M 230,110 L 230,200 A 90 25 0 0 0 410,200 L 410,110 Z" fill="#172554" stroke="#38bdf8" stroke-width="2"/>
    <ellipse cx="480" cy="110" rx="90" ry="25" fill="#1e3a5f" stroke="#38bdf8" stroke-width="2"/>
    <path d="M 390,110 L 390,200 A 90 25 0 0 0 570,200 L 570,110 Z" fill="#172554" stroke="#38bdf8" stroke-width="2"/>
  </g>

  <!-- Heavy Platform Top -->
  <polygon points="180,210 620,210 600,230 200,230" fill="#d97706" stroke="#b45309" stroke-width="2"/>
  <rect x="180" y="225" width="440" height="15" fill="#374151" stroke="#4b5563" stroke-width="2"/>

  <!-- Heavy 4 Legs with Cross Bracing -->
  <line x1="220" y1="240" x2="200" y2="440" stroke="#9ca3af" stroke-width="8"/>
  <line x1="340" y1="240" x2="330" y2="440" stroke="#9ca3af" stroke-width="8"/>
  <line x1="460" y1="240" x2="470" y2="440" stroke="#9ca3af" stroke-width="8"/>
  <line x1="580" y1="240" x2="600" y2="440" stroke="#9ca3af" stroke-width="8"/>

  <!-- Cross Bracing (X-trusses) -->
  <g stroke="#d97706" stroke-width="3">
    <line x1="220" y1="250" x2="330" y2="430"/>
    <line x1="340" y1="250" x2="200" y2="430"/>
    <line x1="340" y1="250" x2="470" y2="430"/>
    <line x1="460" y1="250" x2="330" y2="430"/>
    <line x1="460" y1="250" x2="600" y2="430"/>
    <line x1="580" y1="250" x2="470" y2="430"/>
  </g>

  <!-- Intermediate Horizontal Ties -->
  <line x1="210" y1="340" x2="590" y2="340" stroke="#4b5563" stroke-width="5"/>

  <!-- Concrete Pad Footings -->
  <rect x="180" y="440" width="40" height="20" fill="#2d3340" stroke="#4b5563"/>
  <rect x="310" y="440" width="40" height="20" fill="#2d3340" stroke="#4b5563"/>
  <rect x="450" y="440" width="40" height="20" fill="#2d3340" stroke="#4b5563"/>
  <rect x="580" y="440" width="40" height="20" fill="#2d3340" stroke="#4b5563"/>

  <!-- Badge -->
  <g transform="translate(480, 20)">
    <rect width="250" height="34" rx="6" fill="#1e222b" stroke="#374151" stroke-width="1"/>
    <circle cx="18" cy="17" r="4" fill="#d97706"/>
    <text x="32" y="22" fill="#e5e7eb" font-family="'Outfit', sans-serif" font-size="13" font-weight="600">Heavy Steel Tank Stand</text>
  </g>
</svg>
