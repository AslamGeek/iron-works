<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14161b"/>
      <stop offset="100%" stop-color="#1d2027"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgGrad5)"/>

  <!-- Balcony Slab -->
  <rect x="50" y="380" width="700" height="80" fill="#242832" stroke="#374151" stroke-width="2"/>
  <rect x="50" y="370" width="700" height="15" fill="#323846"/>

  <!-- Railing Posts -->
  <rect x="90" y="160" width="14" height="210" fill="#9ca3af"/>
  <rect x="230" y="160" width="14" height="210" fill="#9ca3af"/>
  <rect x="370" y="160" width="14" height="210" fill="#9ca3af"/>
  <rect x="510" y="160" width="14" height="210" fill="#9ca3af"/>
  <rect x="650" y="160" width="14" height="210" fill="#9ca3af"/>

  <!-- Handrail -->
  <rect x="70" y="145" width="610" height="20" rx="4" fill="#d97706" stroke="#b45309" stroke-width="2"/>

  <!-- Horizontal Pipes -->
  <line x1="90" y1="195" x2="660" y2="195" stroke="#4b5563" stroke-width="3"/>
  <line x1="90" y1="240" x2="660" y2="240" stroke="#4b5563" stroke-width="3"/>
  <line x1="90" y1="285" x2="660" y2="285" stroke="#4b5563" stroke-width="3"/>
  <line x1="90" y1="330" x2="660" y2="330" stroke="#4b5563" stroke-width="3"/>

  <!-- Vertical Pickets -->
  <g stroke="#9ca3af" stroke-width="2">
    <line x1="125" y1="165" x2="125" y2="370"/>
    <line x1="160" y1="165" x2="160" y2="370"/>
    <line x1="195" y1="165" x2="195" y2="370"/>
    <line x1="265" y1="165" x2="265" y2="370"/>
    <line x1="300" y1="165" x2="300" y2="370"/>
    <line x1="335" y1="165" x2="335" y2="370"/>
    <line x1="405" y1="165" x2="405" y2="370"/>
    <line x1="440" y1="165" x2="440" y2="370"/>
    <line x1="475" y1="165" x2="475" y2="370"/>
    <line x1="545" y1="165" x2="545" y2="370"/>
    <line x1="580" y1="165" x2="580" y2="370"/>
    <line x1="615" y1="165" x2="615" y2="370"/>
  </g>

  <!-- Base Plate Anchors -->
  <rect x="80" y="365" width="34" height="10" fill="#d97706" rx="2"/>
  <rect x="220" y="365" width="34" height="10" fill="#d97706" rx="2"/>
  <rect x="360" y="365" width="34" height="10" fill="#d97706" rx="2"/>
  <rect x="500" y="365" width="34" height="10" fill="#d97706" rx="2"/>
  <rect x="640" y="365" width="34" height="10" fill="#d97706" rx="2"/>

  <g transform="translate(480, 20)">
    <rect width="250" height="34" rx="6" fill="#1e222b" stroke="#374151" stroke-width="1"/>
    <circle cx="18" cy="17" r="4" fill="#d97706"/>
    <text x="32" y="22" fill="#e5e7eb" font-family="'Outfit', sans-serif" font-size="13" font-weight="600">Terrace & Balcony Railing</text>
  </g>
</svg>
