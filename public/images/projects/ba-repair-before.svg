<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#171513"/>
  
  <!-- Damaged gate pillar & fractured hinge -->
  <rect x="180" y="80" width="70" height="380" fill="#2d2620" stroke="#42352b" stroke-width="2"/>
  <rect x="250" y="140" width="380" height="300" fill="#241e1a" stroke="#78350f" stroke-width="4" transform="rotate(2.5 250 140)"/>

  <!-- Sheared top hinge -->
  <rect x="235" y="160" width="20" height="30" fill="#5c2609"/>
  <polygon points="255,165 270,170 260,185 248,180" fill="#78350f"/>
  <!-- Fracture crack jagged line -->
  <path d="M 235,175 L 245,173 L 243,180 L 253,178 L 255,185" fill="none" stroke="#ef4444" stroke-width="3"/>

  <!-- Dropping gate corner touching ground -->
  <circle cx="630" cy="455" r="14" fill="#ef4444" opacity="0.3"/>
  <line x1="250" y1="440" x2="630" y2="455" stroke="#ef4444" stroke-width="2" stroke-dasharray="6,4"/>

  <g transform="translate(40, 40)">
    <rect width="210" height="32" rx="4" fill="#451a03" stroke="#b45309" stroke-width="1.5"/>
    <text x="105" y="21" fill="#fcd34d" font-family="'Outfit', sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">BEFORE: BROKEN SHEARED HINGE</text>
  </g>
</svg>
