<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14161b"/>
      <stop offset="100%" stop-color="#1d2027"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgGrad7)"/>

  <!-- Low Masonry Wall Base -->
  <rect x="50" y="360" width="700" height="90" fill="#222630" stroke="#374151" stroke-width="2"/>
  <rect x="40" y="350" width="720" height="15" fill="#323846"/>

  <!-- Heavy Support Posts -->
  <rect x="80" y="140" width="16" height="210" fill="#4b5563"/>
  <rect x="390" y="140" width="16" height="210" fill="#4b5563"/>
  <rect x="700" y="140" width="16" height="210" fill="#4b5563"/>

  <!-- Horizontal Railings -->
  <line x1="80" y1="180" x2="716" y2="180" stroke="#4b5563" stroke-width="4"/>
  <line x1="80" y1="330" x2="716" y2="330" stroke="#4b5563" stroke-width="4"/>

  <!-- Spear Vertical Pickets -->
  <g stroke="#9ca3af" stroke-width="3">
    <!-- Loop pickets with spearheads -->
    <line x1="120" y1="150" x2="120" y2="350"/>
    <line x1="155" y1="150" x2="155" y2="350"/>
    <line x1="190" y1="150" x2="190" y2="350"/>
    <line x1="225" y1="150" x2="225" y2="350"/>
    <line x1="260" y1="150" x2="260" y2="350"/>
    <line x1="295" y1="150" x2="295" y2="350"/>
    <line x1="330" y1="150" x2="330" y2="350"/>
    <line x1="365" y1="150" x2="365" y2="350"/>
    
    <line x1="430" y1="150" x2="430" y2="350"/>
    <line x1="465" y1="150" x2="465" y2="350"/>
    <line x1="500" y1="150" x2="500" y2="350"/>
    <line x1="535" y1="150" x2="535" y2="350"/>
    <line x1="570" y1="150" x2="570" y2="350"/>
    <line x1="605" y1="150" x2="605" y2="350"/>
    <line x1="640" y1="150" x2="640" y2="350"/>
    <line x1="675" y1="150" x2="675" y2="350"/>
  </g>

  <!-- Spear Heads -->
  <g fill="#d97706">
    <polygon points="120,130 114,150 126,150"/>
    <polygon points="155,130 149,150 161,150"/>
    <polygon points="190,130 184,150 196,150"/>
    <polygon points="225,130 219,150 231,150"/>
    <polygon points="260,130 254,150 266,150"/>
    <polygon points="295,130 289,150 301,150"/>
    <polygon points="330,130 324,150 336,150"/>
    <polygon points="365,130 359,150 371,150"/>

    <polygon points="430,130 424,150 436,150"/>
    <polygon points="465,130 459,150 471,150"/>
    <polygon points="500,130 494,150 506,150"/>
    <polygon points="535,130 529,150 541,150"/>
    <polygon points="570,130 564,150 576,150"/>
    <polygon points="605,130 599,150 611,150"/>
    <polygon points="640,130 634,150 646,150"/>
    <polygon points="675,130 669,150 681,150"/>
  </g>

  <g transform="translate(480, 20)">
    <rect width="250" height="34" rx="6" fill="#1e222b" stroke="#374151" stroke-width="1"/>
    <circle cx="18" cy="17" r="4" fill="#d97706"/>
    <text x="32" y="22" fill="#e5e7eb" font-family="'Outfit', sans-serif" font-size="13" font-weight="600">Anti-Climb Spear Fencing</text>
  </g>
</svg>
