<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14161b"/>
      <stop offset="100%" stop-color="#1d2027"/>
    </linearGradient>
    <linearGradient id="ironGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3d434f"/>
      <stop offset="50%" stop-color="#242831"/>
      <stop offset="100%" stop-color="#181a20"/>
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#232731" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>
  <rect width="800" height="500" fill="url(#grid)" opacity="0.6"/>

  <!-- Boundary Pillars -->
  <rect x="70" y="80" width="80" height="380" fill="#2a2e38" stroke="#3e4452" stroke-width="2"/>
  <rect x="650" y="80" width="80" height="380" fill="#2a2e38" stroke="#3e4452" stroke-width="2"/>
  <!-- Pillar Caps -->
  <polygon points="60,80 160,80 150,60 70,60" fill="#383e4c"/>
  <polygon points="640,80 740,80 730,60 650,60" fill="#383e4c"/>

  <!-- Ground Track -->
  <rect x="60" y="445" width="680" height="15" fill="#474f5e"/>
  <line x1="60" y1="448" x2="740" y2="448" stroke="#f59e0b" stroke-width="2"/>

  <!-- Main Sliding Compound Gate Frame -->
  <rect x="160" y="110" width="480" height="330" fill="url(#ironGrad)" stroke="#4b5563" stroke-width="4" rx="3"/>

  <!-- Horizontal Dividers -->
  <line x1="160" y1="180" x2="640" y2="180" stroke="#4b5563" stroke-width="3"/>
  <line x1="160" y1="370" x2="640" y2="370" stroke="#4b5563" stroke-width="3"/>

  <!-- Top Geometric Louvers -->
  <g stroke="#9ca3af" stroke-width="2">
    <line x1="190" y1="115" x2="190" y2="175"/>
    <line x1="220" y1="115" x2="220" y2="175"/>
    <line x1="250" y1="115" x2="250" y2="175"/>
    <line x1="280" y1="115" x2="280" y2="175"/>
    <line x1="310" y1="115" x2="310" y2="175"/>
    <line x1="340" y1="115" x2="340" y2="175"/>
    <line x1="370" y1="115" x2="370" y2="175"/>
    <line x1="400" y1="115" x2="400" y2="175"/>
    <line x1="430" y1="115" x2="430" y2="175"/>
    <line x1="460" y1="115" x2="460" y2="175"/>
    <line x1="490" y1="115" x2="490" y2="175"/>
    <line x1="520" y1="115" x2="520" y2="175"/>
    <line x1="550" y1="115" x2="550" y2="175"/>
    <line x1="580" y1="115" x2="580" y2="175"/>
    <line x1="610" y1="115" x2="610" y2="175"/>
  </g>

  <!-- Middle Decorative Ironwork Panel -->
  <g stroke="#d97706" stroke-width="2" fill="none">
    <rect x="180" y="195" width="440" height="160" stroke="#374151" stroke-width="2"/>
    <!-- Diamond Motifs -->
    <polygon points="260,275 290,230 320,275 290,320"/>
    <polygon points="370,275 400,230 430,275 400,320"/>
    <polygon points="480,275 510,230 540,275 510,320"/>
    <line x1="180" y1="275" x2="620" y2="275" stroke="#4b5563" stroke-width="1.5"/>
  </g>

  <!-- Bottom Heavy Sheet Base -->
  <rect x="165" y="375" width="470" height="60" fill="#1b1e25" stroke="#374151" stroke-width="1"/>
  <circle cx="210" cy="405" r="4" fill="#9ca3af"/>
  <circle cx="270" cy="405" r="4" fill="#9ca3af"/>
  <circle cx="330" cy="405" r="4" fill="#9ca3af"/>
  <circle cx="390" cy="405" r="4" fill="#9ca3af"/>
  <circle cx="450" cy="405" r="4" fill="#9ca3af"/>
  <circle cx="510" cy="405" r="4" fill="#9ca3af"/>
  <circle cx="570" cy="405" r="4" fill="#9ca3af"/>

  <!-- Rollers -->
  <circle cx="230" cy="445" r="10" fill="#6b7280" stroke="#111827" stroke-width="2"/>
  <circle cx="570" cy="445" r="10" fill="#6b7280" stroke="#111827" stroke-width="2"/>

  <!-- Technical Spec Badge -->
  <g transform="translate(480, 30)">
    <rect width="250" height="34" rx="6" fill="#1e222b" stroke="#374151" stroke-width="1"/>
    <circle cx="18" cy="17" r="4" fill="#d97706"/>
    <text x="32" y="22" fill="#e5e7eb" font-family="'Outfit', sans-serif" font-size="13" font-weight="600">Heavy-Duty Compound Gate</text>
  </g>
</svg>
