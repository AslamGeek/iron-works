<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#121316"/>
  
  <!-- Restored Pillars with Crisp Stone Caps -->
  <rect x="70" y="80" width="70" height="380" fill="#252932" stroke="#3e4554" stroke-width="2"/>
  <polygon points="60,80 150,80 140,60 70,60" fill="#3b4252"/>
  <rect x="660" y="80" width="70" height="380" fill="#252932" stroke="#3e4554" stroke-width="2"/>
  <polygon points="650,80 740,80 730,60 660,60" fill="#3b4252"/>

  <!-- High-Precision Bottom Track -->
  <rect x="60" y="445" width="680" height="12" fill="#374151"/>
  <line x1="60" y1="448" x2="740" y2="448" stroke="#10b981" stroke-width="2"/>

  <!-- Architectural Gate - Perfectly Square & Level -->
  <rect x="145" y="105" width="510" height="340" fill="#181a20" stroke="#475569" stroke-width="4" rx="2"/>

  <!-- Horizontal divider lines -->
  <line x1="145" y1="170" x2="655" y2="170" stroke="#475569" stroke-width="3"/>
  <line x1="145" y1="375" x2="655" y2="375" stroke="#475569" stroke-width="3"/>

  <!-- Vertical modern louvers -->
  <g stroke="#94a3b8" stroke-width="2.5">
    <line x1="180" y1="110" x2="180" y2="165"/>
    <line x1="210" y1="110" x2="210" y2="165"/>
    <line x1="240" y1="110" x2="240" y2="165"/>
    <line x1="270" y1="110" x2="270" y2="165"/>
    <line x1="300" y1="110" x2="300" y2="165"/>
    <line x1="330" y1="110" x2="330" y2="165"/>
    <line x1="360" y1="110" x2="360" y2="165"/>
    <line x1="390" y1="110" x2="390" y2="165"/>
    <line x1="420" y1="110" x2="420" y2="165"/>
    <line x1="450" y1="110" x2="450" y2="165"/>
    <line x1="480" y1="110" x2="480" y2="165"/>
    <line x1="510" y1="110" x2="510" y2="165"/>
    <line x1="540" y1="110" x2="540" y2="165"/>
    <line x1="570" y1="110" x2="570" y2="165"/>
    <line x1="600" y1="110" x2="600" y2="165"/>
  </g>

  <!-- Mid Accent Panel -->
  <rect x="165" y="185" width="470" height="175" fill="#1b1e26" stroke="#334155" stroke-width="2"/>
  <!-- Gold Accent Trim -->
  <line x1="165" y1="272" x2="635" y2="272" stroke="#d97706" stroke-width="2"/>
  <polygon points="380,272 400,240 420,272 400,304" fill="none" stroke="#d97706" stroke-width="2"/>

  <!-- Sealed Solid Bottom Panel -->
  <rect x="150" y="380" width="500" height="60" fill="#1f242d"/>
  <g fill="#94a3b8">
    <circle cx="200" cy="410" r="4"/>
    <circle cx="300" cy="410" r="4"/>
    <circle cx="400" cy="410" r="4"/>
    <circle cx="500" cy="410" r="4"/>
    <circle cx="600" cy="410" r="4"/>
  </g>

  <!-- Precision Roller Wheels -->
  <circle cx="210" cy="445" r="9" fill="#94a3b8" stroke="#0f172a" stroke-width="2"/>
  <circle cx="590" cy="445" r="9" fill="#94a3b8" stroke="#0f172a" stroke-width="2"/>

  <!-- Condition Badge -->
  <g transform="translate(40, 40)">
    <rect width="210" height="32" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
    <text x="105" y="21" fill="#a7f3d0" font-family="'Outfit', sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">AFTER: REINFORCED SLIDING GATE</text>
  </g>
</svg>
