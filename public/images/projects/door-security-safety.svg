<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14161b"/>
      <stop offset="100%" stop-color="#1d2027"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgGrad3)"/>

  <!-- Wall Frame -->
  <rect x="250" y="50" width="300" height="420" fill="#1e222a" stroke="#374151" stroke-width="4"/>
  <!-- Door Outer Frame -->
  <rect x="270" y="70" width="260" height="380" fill="#181a20" stroke="#4b5563" stroke-width="5"/>

  <!-- Grid of bars -->
  <g stroke="#9ca3af" stroke-width="3">
    <line x1="310" y1="80" x2="310" y2="440"/>
    <line x1="350" y1="80" x2="350" y2="440"/>
    <line x1="390" y1="80" x2="390" y2="440"/>
    <line x1="430" y1="80" x2="430" y2="440"/>
    <line x1="470" y1="80" x2="470" y2="440"/>
    
    <line x1="280" y1="130" x2="520" y2="130"/>
    <line x1="280" y1="190" x2="520" y2="190"/>
    <line x1="280" y1="250" x2="520" y2="250"/>
    <line x1="280" y1="310" x2="520" y2="310"/>
    <line x1="280" y1="370" x2="520" y2="370"/>
  </g>

  <!-- Heavy Lock Box and Handle -->
  <rect x="470" y="220" width="50" height="70" fill="#2d323e" stroke="#d97706" stroke-width="2" rx="3"/>
  <circle cx="495" cy="245" r="5" fill="#f59e0b"/>
  <rect x="505" y="240" width="22" height="10" fill="#9ca3af" rx="2"/>

  <!-- Heavy Hinges -->
  <rect x="264" y="110" width="10" height="36" fill="#d97706" rx="2"/>
  <rect x="264" y="240" width="10" height="36" fill="#d97706" rx="2"/>
  <rect x="264" y="370" width="10" height="36" fill="#d97706" rx="2"/>

  <!-- Badge -->
  <g transform="translate(480, 20)">
    <rect width="250" height="34" rx="6" fill="#1e222b" stroke="#374151" stroke-width="1"/>
    <circle cx="18" cy="17" r="4" fill="#d97706"/>
    <text x="32" y="22" fill="#e5e7eb" font-family="'Outfit', sans-serif" font-size="13" font-weight="600">Heavy Security Safety Door</text>
  </g>
</svg>
