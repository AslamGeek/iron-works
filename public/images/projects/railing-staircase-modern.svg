<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14161b"/>
      <stop offset="100%" stop-color="#1d2027"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgGrad4)"/>

  <!-- Concrete Stair Steps -->
  <path d="M 80,440 L 220,440 L 220,370 L 360,370 L 360,300 L 500,300 L 500,230 L 640,230 L 640,160 L 720,160 L 720,470 L 80,470 Z" fill="#20242d" stroke="#374151" stroke-width="2"/>

  <!-- Slanted Handrail -->
  <line x1="140" y1="300" x2="680" y2="30" stroke="#d97706" stroke-width="8" stroke-linecap="round"/>
  <line x1="140" y1="340" x2="680" y2="70" stroke="#4b5563" stroke-width="4"/>

  <!-- Posts -->
  <line x1="150" y1="440" x2="150" y2="295" stroke="#9ca3af" stroke-width="5"/>
  <line x1="290" y1="370" x2="290" y2="225" stroke="#9ca3af" stroke-width="5"/>
  <line x1="430" y1="300" x2="430" y2="155" stroke="#9ca3af" stroke-width="5"/>
  <line x1="570" y1="230" x2="570" y2="85" stroke="#9ca3af" stroke-width="5"/>
  <line x1="670" y1="160" x2="670" y2="30" stroke="#9ca3af" stroke-width="5"/>

  <!-- Base Plates -->
  <rect x="135" y="435" width="30" height="8" fill="#d97706" rx="2"/>
  <rect x="275" y="365" width="30" height="8" fill="#d97706" rx="2"/>
  <rect x="415" y="295" width="30" height="8" fill="#d97706" rx="2"/>
  <rect x="555" y="225" width="30" height="8" fill="#d97706" rx="2"/>
  <rect x="655" y="155" width="30" height="8" fill="#d97706" rx="2"/>

  <!-- Thin Balusters -->
  <g stroke="#6b7280" stroke-width="2">
    <line x1="185" y1="440" x2="185" y2="270"/>
    <line x1="220" y1="370" x2="220" y2="245"/>
    <line x1="255" y1="370" x2="255" y2="220"/>
    <line x1="325" y1="370" x2="325" y2="170"/>
    <line x1="360" y1="300" x2="360" y2="145"/>
    <line x1="395" y1="300" x2="395" y2="120"/>
    <line x1="465" y1="300" x2="465" y2="70"/>
    <line x1="500" y1="230" x2="500" y2="45"/>
    <line x1="535" y1="230" x2="535" y2="20"/>
    <line x1="605" y1="230" x2="605" y2="0"/>
  </g>

  <g transform="translate(480, 20)">
    <rect width="250" height="34" rx="6" fill="#1e222b" stroke="#374151" stroke-width="1"/>
    <circle cx="18" cy="17" r="4" fill="#d97706"/>
    <text x="32" y="22" fill="#e5e7eb" font-family="'Outfit', sans-serif" font-size="13" font-weight="600">Modern Staircase Balustrade</text>
  </g>
</svg>
